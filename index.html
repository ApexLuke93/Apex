<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Apex</title>
<style>
:root{
  --bg:#09090e;--bg2:#101017;--bg3:#18181f;--bg4:#202028;--bg5:#2a2a33;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --tx:#ededf5;--tx2:#a3a3bb;--tx3:#8b8ba3;
  --green:#22c55e;--greenD:rgba(34,197,94,.13);--amber:#f5a524;--amberD:rgba(245,165,36,.13);
  --red:#ef4444;--redD:rgba(239,68,68,.13);--blue:#5b8cff;--blueD:rgba(91,140,255,.13);--teal:#14b8a6;
  --r:14px;--rs:10px;
  --acc:#22c55e;--accD:rgba(34,197,94,.14);--accInk:#06210f;--heroA:#16231c;--tabbg:rgba(16,16,23,.92);--warn:var(--amber);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(76px + var(--safeB))}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
input{font-family:inherit;font-size:16px}
.mono{font-family:var(--mono)}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + var(--safeT)) 16px 24px}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapflex{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:var(--bg4);font:600 11px var(--mono);color:var(--tx2);letter-spacing:.04em}
.chip.g{background:var(--greenD);color:var(--green)}.chip.a{background:var(--amberD);color:var(--amber)}.chip.r{background:var(--redD);color:var(--red)}.chip.b{background:var(--blueD);color:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:var(--rs);font-weight:650;font-size:16px;background:var(--bg4);border:1px solid var(--line2)}
.btn.primary{background:var(--green);color:#06210f;border:none}
.btn.big{min-height:62px;font-size:18px;width:100%}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sep{height:1px;background:var(--line);margin:14px 0}
/* Tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(16,16,23,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safeB));z-index:50}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--tx3);font-size:11px;font-weight:600}
#tabs button.on{color:var(--tx)}
#tabs svg{width:22px;height:22px}
/* Today hero */
.hero{background:linear-gradient(160deg,#16231c 0%,var(--bg2) 55%);border:1px solid rgba(34,197,94,.22)}
.dev{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dev span{font:600 11px var(--mono);padding:5px 8px;border-radius:7px;background:rgba(255,255,255,.05);color:var(--tx2)}
.dev b{color:var(--green);margin-left:4px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{border-radius:10px;background:var(--bg3);padding:7px 0 6px;text-align:center;border:1px solid transparent}
.day.today{border-color:var(--green)}
.day .d{font:600 10px var(--mono);color:var(--tx3)}
.day .s{font-weight:700;font-size:15px;margin-top:3px}
.day .st{width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:var(--bg5)}
.st.done{background:var(--green)}.st.miss{background:var(--red)}.st.opt{background:transparent;border:1px solid var(--tx3)}
.pick{display:flex;gap:6px}
.pick button{flex:1;min-height:44px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);font-weight:650}
.pick button.sel{background:var(--greenD);border-color:var(--green);color:var(--green)}
.bar{height:6px;border-radius:4px;background:var(--bg4);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
/* Player */
#player{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
#player.open{display:flex}
.ph{padding:calc(10px + var(--safeT)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.pfoot{padding:10px 16px calc(10px + var(--safeB));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.progress-dots{display:flex;gap:3px;flex:1}
.progress-dots i{flex:1;height:4px;border-radius:2px;background:var(--bg4)}
.progress-dots i.d{background:var(--green)}.progress-dots i.c{background:var(--tx2)}
.target{font:700 30px/1.1 var(--mono);letter-spacing:-.02em;margin-top:6px}
.reason{font-size:13px;color:var(--tx2);margin-top:6px;line-height:1.45}
.setrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.setrow.cur{border-color:var(--green);background:#0f1a14}
.setrow.done{opacity:.75}
.setrow .n{font:600 12px var(--mono);color:var(--tx3);width:44px}
.setrow .v{flex:1;font:650 19px var(--mono)}
.tick{width:58px;height:58px;border-radius:14px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;border:1px solid var(--line2)}
.setrow.cur .tick{background:var(--green);color:#06210f;border:none}
.setrow.done .tick{background:var(--greenD);color:var(--green);border:none;width:44px;height:44px;font-size:18px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:11px;background:var(--bg4);font-size:22px;font-weight:600}
.stepper .val{min-width:74px;text-align:center;font:700 22px var(--mono)}
.editor{background:var(--bg3);border-radius:12px;padding:12px;margin-top:8px}
.editor .lbl{font:600 11px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.rpe{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.rpe button{min-height:44px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);font:650 14px var(--mono)}
.rpe button.sel{background:var(--green);color:#06210f;border:none}
.num{width:100%;min-height:50px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;color:var(--tx);padding:0 12px;font:650 18px var(--mono)}
.taps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.taps button{width:56px;height:56px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);font:700 15px var(--mono)}
.taps button.on{background:var(--green);color:#06210f;border:none}
#rest{display:none;position:fixed;left:12px;right:12px;top:calc(8px + var(--safeT));z-index:120;background:#0f1a14;border:1px solid var(--green);border-radius:16px;padding:12px 14px}
#rest.on{display:block}
#rest .t{font:700 34px var(--mono)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:210;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safeB));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;border-top:1px solid var(--line2)}
.sheet.open{transform:none}
.sheet-bg.open{display:block}
.handle{width:40px;height:5px;border-radius:3px;background:var(--bg5);margin:-6px auto 14px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.toast{position:fixed;left:50%;top:calc(10px + var(--safeT));transform:translateX(-50%);background:var(--green);color:#06210f;padding:10px 16px;border-radius:10px;font-weight:650;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}.toast.err{background:var(--red);color:#fff}
.pb{background:linear-gradient(140deg,#1d2a17,#101a12);border:1px solid var(--green);border-radius:var(--r);padding:16px;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font:600 10px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
.warn{background:var(--amberD);border:1px solid rgba(245,165,36,.35);color:var(--amber);border-radius:12px;padding:12px;font-size:14px;margin-top:10px;line-height:1.45}
/* Player card */
.pcard{margin-top:14px;border-radius:20px;padding:18px 16px 12px;background:linear-gradient(155deg,#1b1d24 0%,#0f1015 60%,#14151b 100%);border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden}
.pcard:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 45%,transparent 60%);pointer-events:none}
.pcard.t1{border-color:rgba(205,127,50,.55)}.pcard.t2{border-color:rgba(192,192,200,.6)}.pcard.t3{border-color:rgba(230,190,90,.7)}.pcard.t4{border-color:rgba(34,197,94,.8);box-shadow:0 0 30px rgba(34,197,94,.12)}
.pc-top{display:flex;gap:16px;align-items:center}
.pc-ovr{font:800 52px/1 var(--mono);letter-spacing:-.04em}
.pc-pos{font:700 13px var(--mono);color:var(--tx2);letter-spacing:.14em;text-align:center;margin-top:2px}
.pc-name{font:800 22px var(--font);letter-spacing:.06em}
.pc-sub{font:500 11px var(--mono);color:var(--tx3);letter-spacing:.04em;margin-top:4px}
.pc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.pc-stat{display:flex;flex-direction:column;align-items:flex-start;background:rgba(255,255,255,.04);border-radius:12px;padding:10px;text-align:left;border:1px solid var(--line)}
.pc-v{font:800 26px/1 var(--mono)}.pc-v.stale{color:var(--tx3)}
.pc-k{font:700 12px var(--mono);color:var(--tx2);letter-spacing:.14em;margin-top:4px}
.pc-c{font:500 10px var(--mono);color:var(--tx3);margin-top:3px}
.pc-foot{font:500 10px var(--mono);color:var(--tx3);margin-top:12px;line-height:1.5}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mission i{width:22px;height:22px;border-radius:7px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;flex-shrink:0}
.mission.on i{background:var(--green);color:#06210f;border:none}.mission.on span{color:var(--tx2)}
.mission span{flex:1}.mission em{font:500 11px var(--mono);color:var(--tx3);font-style:normal}
.lvbar{position:relative;height:74px;margin:18px 6px 4px;border-top:3px solid var(--bg4)}
.lvseg{position:absolute;top:-3px;transform:translateX(-50%);text-align:center}
.lvseg i{display:block;width:2px;height:10px;background:var(--tx3);margin:0 auto}
.lvseg span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:600 9px var(--mono);color:var(--tx3)}
.lvseg em{display:block;font:500 9px var(--mono);color:var(--tx3);font-style:normal;margin-top:2px;white-space:nowrap}
.lvyou{position:absolute;top:-10px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.lvyou b{position:absolute;top:40px;left:50%;transform:translateX(-50%);font:800 11px var(--mono);color:var(--green)}
.lvprev{position:absolute;top:-6px;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--tx2)}
.loadbars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:90px;align-items:end;margin-top:8px}
.loadbars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.loadbars i{display:block;background:var(--green);border-radius:4px 4px 0 0;opacity:.75;min-height:2px}
.loadbars span{font:500 10px var(--mono);color:var(--tx3);margin-top:4px}
.pgrid{display:block}
@media (min-width:900px){.pgrid{display:grid;grid-template-columns:360px 1fr;gap:16px}}

/* ── Themes (all pairs checked to WCAG AA) ── */
[data-accent=blue]{--acc:#5b9bff;--accD:rgba(91,155,255,.15);--accInk:#061229;--heroA:#141c2c}
[data-accent=amber]{--acc:#f2a541;--accD:rgba(242,165,65,.15);--accInk:#2a1700;--heroA:#2a2114}
[data-accent=violet]{--acc:#b39dfb;--accD:rgba(179,157,251,.16);--accInk:#160c33;--heroA:#1d1830}
[data-theme=light]{--bg:#f5f6f8;--bg2:#ffffff;--bg3:#eef0f4;--bg4:#e2e5eb;--bg5:#cfd4dc;--line:rgba(16,18,27,.10);--line2:rgba(16,18,27,.18);--tx:#12131a;--tx2:#424555;--tx3:#5b5f6f;
  --green:#126b33;--greenD:rgba(18,107,51,.12);--amber:#9a5a06;--amberD:rgba(154,90,6,.12);--red:#c81e1e;--redD:rgba(200,30,30,.10);--blue:#1d4ed8;--blueD:rgba(29,78,216,.10);
  --acc:#15803d;--accD:rgba(21,128,61,.12);--accInk:#ffffff;--heroA:#e5f4ea;--tabbg:rgba(255,255,255,.94)}
[data-theme=light][data-accent=blue]{--acc:#1d4ed8;--accD:rgba(29,78,216,.10);--heroA:#e6edfc}
[data-theme=light][data-accent=amber]{--acc:#a1520a;--accD:rgba(161,82,10,.12);--heroA:#fbefdf}
[data-theme=light][data-accent=violet]{--acc:#6d28d9;--accD:rgba(109,40,217,.10);--heroA:#efe8fc}
[data-theme=contrast]{--bg:#000;--bg2:#0a0a0a;--bg3:#151515;--bg4:#222;--bg5:#333;--line:rgba(255,255,255,.3);--line2:rgba(255,255,255,.55);--tx:#fff;--tx2:#e8e8e8;--tx3:#c8c8c8;
  --green:#5ee88f;--greenD:rgba(94,232,143,.18);--amber:#ffc24a;--amberD:rgba(255,194,74,.18);--red:#ff7a7a;--redD:rgba(255,122,122,.18);--blue:#8ab4ff;--heroA:#000;--tabbg:rgba(0,0,0,.96)}
[data-status=cvd]{--green:#56b4e9;--greenD:rgba(86,180,233,.15);--amber:#e69f00;--amberD:rgba(230,159,0,.15);--red:#ff8c42;--redD:rgba(255,140,66,.15)}
[data-theme=light][data-status=cvd]{--green:#0063a0;--greenD:rgba(0,99,160,.10);--amber:#8a5a00;--amberD:rgba(138,90,0,.12);--red:#b23b00;--redD:rgba(178,59,0,.10)}
[data-text=l] .wrap,[data-text=l] .pbody,[data-text=l] #sheetBody,[data-text=l] .ph,[data-text=l] .pfoot{zoom:1.12}
[data-text=xl] .wrap,[data-text=xl] .pbody,[data-text=xl] #sheetBody,[data-text=xl] .ph,[data-text=xl] .pfoot{zoom:1.25}
[data-motion=reduce] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
/* accent-driven components */
.btn.primary,.toast{background:var(--acc);color:var(--accInk)}
.hero{background:linear-gradient(160deg,var(--heroA) 0%,var(--bg2) 60%);border-color:var(--accD)}
#tabs{background:var(--tabbg)}#tabs button.on{color:var(--acc)}
.day.today{border-color:var(--acc)}
.pick button.sel{background:var(--accD);border-color:var(--acc);color:var(--tx)}
.bar i,.loadbars i{background:var(--acc)}
.setrow.cur{border-color:var(--acc);background:var(--accD)}
.setrow.cur .tick,.rpe button.sel,.taps button.on,.mission.on i{background:var(--acc);color:var(--accInk)}
#rest{border-color:var(--acc);background:var(--bg2)}
.pb{background:var(--accD);border-color:var(--acc)}
.lvyou{background:var(--acc)}.lvyou b{color:var(--acc)}
.ok{color:var(--green)}.warn-t{color:var(--amber)}
.layer{background:var(--bg3);border-radius:12px;padding:12px;margin-top:10px}
.layer summary{cursor:pointer}
.lbl{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.pcard{--tx:#ededf5;--tx2:#b4b4ca;--tx3:#9d9db5;--line:rgba(255,255,255,.1);--green:#22c55e;--red:#f87171;color:var(--tx)}
[data-status=cvd] .pcard{--green:#56b4e9;--red:#ff8c42}
.pc-left{display:flex;flex-direction:column;align-items:center;background:none;border:none;padding:0}
.pc-stat .up{color:var(--green)}.pc-stat .dn{color:var(--red)}
.chip.g{color:var(--green);background:var(--greenD)}.chip.a{color:var(--amber);background:var(--amberD)}.chip.r{color:var(--red);background:var(--redD)}
.mono.ok{color:var(--green)}
/* ── Card tiers & specials ── */
.pcard{padding-top:38px}
.pc-ribbon{position:absolute;top:0;right:0;font:800 10px var(--mono);letter-spacing:.16em;padding:6px 12px;border-bottom-left-radius:12px;background:rgba(0,0,0,.35);color:var(--tx);z-index:1}
.pcard .pc-stat{background:rgba(0,0,0,.26)}
.pcard.tier-bronze{background:linear-gradient(150deg,#2e1d10 0%,#5f3b20 42%,#76492a 55%,#3a2414 100%);border-color:#b07a45;--tx:#fff4e8;--tx2:#f3dcc5;--tx3:#efd3b6}
.pcard.tier-silver,.pcard.tier-gold,.pcard.tier-platinum,.pcard.sp-icon{--line:rgba(0,0,0,.12);--green:#0b5d2a;--red:#9b1c1c}
.pcard.tier-silver{background:linear-gradient(150deg,#f1f3f5 0%,#c5ccd4 45%,#e3e7eb 60%,#c9d0d8 100%);border-color:#8d96a1;--tx:#15171c;--tx2:#2f343c;--tx3:#3d434c}
.pcard.tier-gold{background:linear-gradient(150deg,#f7e3a1 0%,#d9ae4b 45%,#f0d27e 60%,#c99c3e 100%);border-color:#9a7424;--tx:#1b1404;--tx2:#2f2408;--tx3:#3a2c0c}
.pcard.tier-platinum{background:linear-gradient(150deg,#eef3f8 0%,#c9d6e3 40%,#f5f8fb 55%,#b9c8d9 100%);border-color:#7f94ab;--tx:#0f1722;--tx2:#223142;--tx3:#2c3a4a}
.pcard.tier-silver .pc-stat,.pcard.tier-gold .pc-stat,.pcard.tier-platinum .pc-stat,.pcard.sp-icon .pc-stat{background:rgba(255,255,255,.38);border-color:rgba(0,0,0,.08)}
.pcard.tier-silver .pc-ribbon,.pcard.tier-gold .pc-ribbon,.pcard.tier-platinum .pc-ribbon,.pcard.sp-icon .pc-ribbon{background:rgba(0,0,0,.78);color:#fff}
.pcard.stale{filter:saturate(.35) brightness(.92)}
.pcard.sp{--tx:#ffffff;--tx2:#e9e9f2;--tx3:#d7d7e4;border-width:2px}
.pcard.sp-potm{background:linear-gradient(150deg,#0b1d4a 0%,#1f3f8f 50%,#0b1d4a 100%);border-color:#f5c84c}.sp-potm .pc-ribbon{background:#f5c84c;color:#0b1d4a}
.pcard.sp-totb{background:linear-gradient(150deg,#05070d 0%,#141b31 55%,#05070d 100%);border-color:#e6c35c}.sp-totb .pc-ribbon{background:#e6c35c;color:#05070d}
.pcard.sp-breakthrough{background:linear-gradient(150deg,#031f22 0%,#0b5c5f 50%,#042a2d 100%);border-color:#5ef0e0}.sp-breakthrough .pc-ribbon{background:#5ef0e0;color:#031f22}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDay = s => { const d = parseD(s); return `${DOW[d.getDay()]} ${d.getDate()} ${d.toLocaleString('en-AU',{month:'short'})}`; };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const epley = (w, r) => (!w || !r) ? null : (r === 1 ? w : w * (1 + r/30));
const round = (x, step=2.5) => Math.round(x/step)*step;
const fmtKg = x => (x == null ? '—' : (Math.round(x*10)/10).toString().replace(/\.0$/,''));
const mmss = s => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
function toast(msg, err) { const t=$('#toast'); t.textContent=msg; t.className='toast on'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',err?6000:2200); }

      try { const raw = localStorage.getItem(LEGACY_KEY); if (raw) migrateLegacy(JSON.parse(raw), 'localStorage'); } catch(e) { console.error(e); }

    }
    if (!this.d.program && DEFAULT_PROGRAM) this.d.program = DEFAULT_PROGRAM;
    if (DEFAULT_PROGRAM && this.d.program?.id === DEFAULT_PROGRAM.id && (this.d.program.version || 1) < (DEFAULT_PROGRAM.version || 1)) {

      this.d.migrations.push({ at: Date.now(), from: 'program v' + (this.d.program.version || 1) + ' → v' + DEFAULT_PROGRAM.version });

function snapshot(reason) {
  try {
    const key = SNAP_PREFIX + Date.now();
    localStorage.setItem(key, JSON.stringify({ meta:{ ts:Date.now(), reason }, data: Store.d }));
    const keys = Object.keys(localStorage).filter(k => k.startsWith(SNAP_PREFIX)).sort();
    keys.slice(0, Math.max(0, keys.length - 4)).forEach(k => localStorage.removeItem(k));
  } catch(e) { console.warn('snapshot skipped', e); }
}

  const keys = Object.keys(localStorage).filter(k => k.startsWith(SNAP_PREFIX));

// MIGRATION — legacy apex_v2 → v3 (non-destructive, idempotent)
// ════════════════════════════════════════════════════════════════════
const CANON = {
  'BB Front Squat':'front_squat','Front Squat':'front_squat',
  'BB Deadlift':'deadlift','Deadlift':'deadlift','Conventional Deadlift':'deadlift',
  'BB Bench Press':'bench_press','Bench Press':'bench_press',
  'BB RDL':'bb_rdl','Romanian Deadlift':'bb_rdl',
  'BB Row':'bb_row','BB Bent-Over Row':'bb_row','Barbell Row':'bb_row',
  'Chin-ups/Pull-ups':'pullup','Pull-up':'pullup',
};
const LIFT_NAMES = { front_squat:'Front Squat', deadlift:'Deadlift', bench_press:'Bench Press', bb_rdl:'Romanian Deadlift', bb_row:'Barbell Row' };

function addObs(o) {
  const key = [o.metric, o.date, o.source, JSON.stringify(o.value)].join('|');
  if (Store.d.observations.some(x => x._key === key)) return false;
  Store.d.observations.push({ id: uid('o'), _key: key, ...o });
  return true;
}

function migrateLegacy(legacy, via) {
  if (!legacy || !Array.isArray(legacy.profiles)) throw new Error('Not legacy Apex data');
  const d = Store.d;
  if (d.legacy) snapshot('pre-legacy-remigrate');
  d.legacy = legacy;                       // kept verbatim for rollback + deep history
  const p = legacy.profiles.find(x => x.id === legacy.activeProfileId) || legacy.profiles[0];
  if (!p) return;
  Object.assign(d.athlete, { name: p.name || d.athlete.name, sex: p.sex || 'M', age: p.age ?? null, heightCm: p.heightCm ?? null, trainingAge: p.trainingAge ?? null });
  let nObs = 0, nBody = 0;
  (p.logs || []).forEach(l => {
    const date = l.date || dstr(new Date(l.timestamp));          // trust the user-entered date, not entry time
    if (l.type === 'body' && l.weight) { mergeBody({ date, weightKg: l.weight, waistCm: l.waist ?? null, hipCm: l.hip ?? null, bfPct: l.bfPct ?? null, bfMethod: l.bfMethod ?? null, source: 'legacy' }); nBody++; }
    if (l.type === 'strength') (l.lifts || []).forEach(lift => {
      const c = CANON[lift.name]; if (!c) return;
      const rows = (lift.setRows && lift.setRows.length) ? lift.setRows : [{ reps: lift.reps, weight: lift.weight, rpe: null }];
      if (c === 'pullup') {
        const best = Math.max(...rows.map(r => r.reps || 0));
        if (addObs({ metric:'pullup_sets', value:{ sets: rows.map(r=>r.reps), strictness:'unknown' }, unit:'reps', date, method:'bodyweight', source:'legacy-log', quality:'verified_mixed_quality' })) nObs++;
        return;
      }
      const top = rows.filter(r => r.weight).sort((a,b) => b.weight - a.weight || b.reps - a.reps)[0];
      if (!top) return;
      if (addObs({ metric: c+'_set', value:{ load: top.weight, reps: top.reps, rpe: top.rpe ?? null }, e1rm: Math.round(epley(top.weight, top.reps)), unit:'kg×reps', date, method:'barbell', source:'legacy-log', quality:'verified' })) nObs++;
    });
    if (l.type === 'conditioning' && l.dist && l.duration) addObs({ metric:'conditioning', value:{ type:l.condType, km:l.dist, min:l.duration }, date, source:'legacy-log', quality:'verified' });
  });
  (p.readiness || []).forEach(r => { if (!d.readiness.some(x => x.date === r.date)) d.readiness.push({ date: r.date, legacy: r }); });
  d.migrations.push({ at: Date.now(), from: 'apex_v2', via, observations: nObs, body: nBody });
}

function mergeBody(e) {
  const d = Store.d, ex = d.body.find(b => b.date === e.date);
  if (!ex) { d.body.push(e); d.body.sort((a,b) => a.date.localeCompare(b.date)); return; }
  for (const k in e) if (e[k] != null && (ex[k] == null || e.source === 'baseline' || e.source === 'user')) ex[k] = e[k];
}

function applyBaseline(b) {
  const d = Store.d;
  d.baseline = b;
  if (b.athlete) Object.assign(d.athlete, { name: b.athlete.name || d.athlete.name, sex: b.athlete.sex || d.athlete.sex, age: b.athlete.age ?? d.athlete.age, heightCm: b.athlete.heightCm ?? d.athlete.heightCm });
  if (b.status) d.athlete.injuryHistory = b.status.injuryHistory || [];
  (b.verified || []).forEach(o => addObs({ ...o, ...(o.value && o.value.load && o.value.reps ? { e1rm: Math.round(epley(o.value.load, o.value.reps)) } : {}), source: 'baseline:' + (o.source || '') }));
  (b.bodyComposition || []).forEach(e => { if (e.date && typeof e.hipCm !== 'string') mergeBody({ date:e.date, weightKg:e.weightKg, waistCm:e.waistCm, hipCm:Array.isArray(e.hipCm)?null:e.hipCm, bfPct:e.bfPct??null, bfMethod:e.bfMethod??null, source:'baseline' }); });
  d.migrations.push({ at: Date.now(), from: 'baseline', schema: b.schema });
}

// ── Program validation (coach / AI import) ──────────────────────────
function validateProgram(p) {
  const errs = [];
  if (!p || p.schema !== 'apex.program/1') errs.push('schema must be "apex.program/1"');
  if (!p?.block?.id || !p?.block?.start) errs.push('block.id and block.start are required');
  if (!p?.sessions || typeof p.sessions !== 'object') errs.push('sessions object missing');
  else for (const [k, s] of Object.entries(p.sessions)) {
    if (!s.name) errs.push(`session ${k}: name missing`);
    if (!Array.isArray(s.slots) || !s.slots.length) errs.push(`session ${k}: slots missing`);
    (s.slots || []).forEach((sl, i) => { if (!sl.id || !sl.name) errs.push(`session ${k} slot ${i+1}: id/name missing`); if (!sl.byWeek) errs.push(`session ${k} slot ${sl.id}: byWeek missing`); });
  }
  if (!Array.isArray(p?.schedule)) errs.push('schedule array missing');
  else p.schedule.forEach((x, i) => { if (!/^\d{4}-\d{2}-\d{2}$/.test(x.date || '')) errs.push(`schedule[${i}] bad date`); if (x.session && !p.sessions?.[x.session]) errs.push(`schedule[${i}] unknown session "${x.session}"`); });
  return errs;
}

// ════════════════════════════════════════════════════════════════════
// SCHEDULE
// ════════════════════════════════════════════════════════════════════
const P = () => Store.d.program;
function scheduleMap() {
  const m = {}; (P()?.schedule || []).forEach(x => m[x.date] = { ...x });
  // swaps: { "a|b": true } → exchange the sessions on two dates
  Object.keys(Store.d.scheduleSwaps || {}).forEach(k => { const [a, b] = k.split('|'); if (m[a] && m[b]) { const t = m[a].session; m[a].session = m[b].session; m[b].session = t; } });
  return m;
}
function dayPlan(date) { const x = scheduleMap()[date]; if (!x) return null; const s = x.session ? P().sessions[x.session] : null; return { ...x, def: s, optional: !!s?.optional }; }
function weekOf(date) { const w = (P()?.weeks || []).filter(w => w.start <= date).pop(); return w && date <= addDays(w.start, 6) ? w : null; }
function weekDates(date) { const w = weekOf(date); if (!w) return []; return Array.from({length:7}, (_,i) => addDays(w.start, i)); }
function spacingWarnings(map) {
  const out = [];
  Object.keys(map).sort().forEach(date => {
    if (map[date].session !== 'C') return;
    const prev = map[addDays(date, -1)];
    if (prev && (prev.session === 'A' || prev.session === 'D')) out.push(`${fmtDay(date)}: max-speed session the day after ${P().sessions[prev.session].name}. Speed quality will suffer.`);
  });
  return out;
}

// ════════════════════════════════════════════════════════════════════
// PROGRESSION ENGINE (deterministic, transparent)
// ════════════════════════════════════════════════════════════════════
const MAIN_LIFTS = ['front_squat','bench_press','deadlift'];
const LIFT_RULES = {
  front_squat: { big: 5, small: 2.5, easyRpe: 6,   start: 20 },
  bench_press: { big: 2.5, small: 2.5, easyRpe: 7, start: 20, smallOnlyAtOrBelow: 7 },
  deadlift:    { big: 10, small: 5, easyRpe: 6.5, start: 40, cap: 'homeMaxKg' },
};
function slotKind(slot, wk) {
  if (slot.exercise === 'pullup_strict') return 'strict';
  if ((slot.exercise || '').startsWith('bikeerg') || slot.exercise === 'cardio_intervals') return 'erg';
  if (slot.exercise === 'run_walk') return 'run';
  if (slot.exercise === 'mobility_post' || slot.exercise === 'mobility_flow') return 'mobility';
  if (wk && wk.holdSec) return 'hold';
  if (MAIN_LIFTS.includes(slot.exercise)) return 'main';
  if (['none','quality_gated'].includes(slot.progression?.model) || slot.intent === 'prep') return 'check';
  return 'lift';
}
// History of a given exercise from V2 sessions (most recent first)
function exHistory(exercise) {
  const out = [];
  [...Store.d.sessions].sort((a,b) => b.endedAt - a.endedAt).forEach(s => (s.slots || []).forEach(sl => { if (sl.exercise === exercise && !sl.skipped) out.push({ session: s, slot: sl }); }));
  return out;
}
function workingSets(sl) { return (sl.sets || []).filter(x => x.done && !x.ramp); }

function prescribeMain(slot, wk) {
  if (wk.load?.mode === 'coach') {
    const r = readinessToday(), low = r && r.band !== 'green' && wk.load.fallback, load = low ? wk.load.fallback : wk.load.kg;
    return { mode: 'load', load, reps: wk.reps, sets: wk.sets, rpe: wk.rpe, coach: true, reason: `Coach (${wk.load.src}): ${fmtKg(wk.load.kg)}kg × ${wk.reps} × ${wk.sets}, RPE ${rr(wk.rpe)}.${low ? ` ${r.band} readiness → ${fmtKg(load)}kg.` : ''} If set 1 is above RPE ${wk.rpe[wk.rpe.length - 1]}, drop 2.5–5kg.${wk.load.note ? ' ' + wk.load.note : ''}` };
  }
  const rule = LIFT_RULES[slot.exercise], hist = exHistory(slot.exercise);
  const last = hist.find(h => workingSets(h.slot).length);
  const refObs = Store.d.observations.filter(o => o.metric === slot.exercise + '_set' && o.quality === 'verified').sort((a,b) => (b.e1rm||0) - (a.e1rm||0))[0];
  if (!last || wk.load?.mode === 'find' && !last) {
    return { mode: 'find', load: rule.start, reps: wk.reps, sets: wk.sets, rpe: wk.rpe,
      reason: 'First exposure since the break: ramp in sets of ' + wk.reps + ' and stop when a set feels RPE ' + rr(wk.rpe) + '. That becomes your current baseline.' + (refObs ? ` Pre-break reference: ${fmtKg(refObs.value.load)}×${refObs.value.reps}${refObs.value.rpe?' @'+refObs.value.rpe:''}.` : '') };
  }
  const ws = workingSets(last.slot), lastLoad = Math.max(...ws.map(s => s.load || 0));
  const finalRpe = last.slot.finalRpe ?? ws[ws.length-1]?.rpe ?? null;
  const targetReps = last.slot.targetReps ?? wk.reps;
  const missed = ws.some(s => (s.reps || 0) < targetReps) || ws.length < (last.slot.targetSets || ws.length);
  const pain = last.session.painFlag;
  let load = lastLoad, why = [];
  why.push(`Last: ${ws.length}×${targetReps} @ ${fmtKg(lastLoad)}kg${finalRpe?`, final set RPE ${finalRpe}`:''}`);
  if (pain) { why.push('pain flagged last session → hold load'); }
  else if (missed) {
    const prevMiss = hist.slice(1).find(h => workingSets(h.slot).length);
    const twice = prevMiss && workingSets(prevMiss.slot).some(s => (s.reps||0) < (prevMiss.slot.targetReps ?? wk.reps));
    if (twice) { load = round(lastLoad * 0.92); why.push('missed reps twice → reset ~8%'); } else why.push('reps missed → repeat load');
  }
  else if (finalRpe == null) { load = lastLoad + rule.small; why.push('no RPE logged → small step'); }
  else if (finalRpe <= rule.easyRpe) { load = lastLoad + rule.big; why.push(`RPE ≤ ${rule.easyRpe} → +${rule.big}kg`); }
  else if (finalRpe <= (rule.smallOnlyAtOrBelow ?? 7)) { load = lastLoad + rule.small; why.push(`RPE ${finalRpe} → +${rule.small}kg`); }
  else { why.push(`RPE ${finalRpe} ≥ 8 → hold`); }
  if (rule.cap && load > Store.d.settings[rule.cap]) { load = Store.d.settings[rule.cap]; why.push(`capped at home-gym ${load}kg — Apex will switch to reps/tempo progression`); }
  const r = readinessToday();
  if (r && r.band === 'amber' && load > lastLoad) { load = lastLoad; why.push('amber readiness → hold today'); }
  return { mode: 'load', load, reps: wk.reps, sets: wk.sets, rpe: wk.rpe, reason: why.join(' · ') };
}
function lastPerformance(exercise) {
  const h = exHistory(exercise).find(h => (h.slot.sets||[]).some(s => s.done));
  if (!h) return null;
  const ws = h.slot.sets.filter(s => s.done && !s.ramp);
  return { date: h.session.scheduledDate, sets: ws };
}

// ════════════════════════════════════════════════════════════════════
// READINESS (3 taps; pain is a separate channel)
// ════════════════════════════════════════════════════════════════════
function readinessToday() { return Store.d.readiness.find(r => r.date === today() && r.v2) || null; }
function readinessBand(r) {
  const s = (r.sleep + r.energy + (6 - r.soreness)) / 15;     // each 1–5
  const low = [r.sleep, r.energy].filter(x => x <= 2).length + (r.soreness >= 4 ? 1 : 0);
  if (low >= 2 || s < .45) return 'red';
  if (low === 1 || s < .65) return 'amber';
  return 'green';
}
const BAND_TEXT = {
  green: ['READY', 'Train as prescribed.'],
  amber: ['MODERATE', 'Keep the primary work. Drop one set from each accessory and don\'t add load today.'],
  red:   ['LOW', 'Consider swapping to the Zone 2 session or mobility. If you train, main lifts at last week\'s load, no speed work.'],
};

// ════════════════════════════════════════════════════════════════════
// WORKOUT SESSION BUILD
// ════════════════════════════════════════════════════════════════════
function buildWorkout(date, sessionKey) {
  const def = P().sessions[sessionKey], w = weekOf(date)?.week || 1;
  return {
    id: uid('s'), scheduledDate: date, sessionKey, week: w, name: def.name, startedAt: Date.now(), idx: 0,
    slots: def.slots.filter(sl => !sl.onlyWeeks || sl.onlyWeeks.includes(w)).map(sl => {
      const wk = sl.byWeek[String(w)] || sl.byWeek['1'] || {};
      const kind = slotKind(sl, wk);
      const base = { slotId: sl.id, exercise: sl.exercise, name: sl.name, kind, priority: sl.priority, intent: sl.intent, wk, cues: sl.cues || '', superset: sl.superset || null, sets: [], measures: {} };
      const nSets = typeof wk.sets === 'number' ? wk.sets : (parseInt(wk.sets) || 1);
      if (kind === 'main') {
        const rx = prescribeMain(sl, wk);
        Object.assign(base, { rx, targetReps: wk.reps, targetSets: wk.sets, finding: rx.mode === 'find', rampLoad: rx.load });
        if (rx.mode === 'load') base.sets = Array.from({length: wk.sets}, () => ({ load: rx.load, reps: wk.reps, done: false }));
      } else if (kind === 'lift') {
        const lp = lastPerformance(sl.exercise);
        const repsNum = typeof wk.reps === 'number' ? wk.reps : null;
        const lastLoad = wk.targetKg ?? lp?.sets?.find(s => s.load)?.load ?? null;
        base.last = lp; base.targetReps = wk.reps;
        base.sets = Array.from({length: nSets}, () => ({ load: lastLoad, reps: repsNum, repsText: repsNum ? null : String(wk.reps ?? ''), done: false }));
      } else if (kind === 'strict') {
        base.sets = [];
        base.baseline = Store.d.observations.filter(o => o.metric === 'pullup_strict_max').sort((a,b) => (b.date||'').localeCompare(a.date||''))[0]?.value ?? null;
      } else if (kind === 'erg') {
        base.sets = wk.workSec ? Array.from({length: nSets}, () => ({ metres: null, done: false })) : [{ metres: null, done: false }];
      } else if (kind === 'hold') {
        base.sets = Array.from({length: nSets}, () => ({ holdSec: wk.holdSec, done: false }));
      } else {
        base.sets = Array.from({length: Math.max(1, nSets)}, () => ({ done: false }));
      }
      return base;
    })
  };
}

// ── Equipment profiles ──────────────────────────────────────────────
function ensureEquip() {
  const d = Store.d;
  if (!d.equipProfiles) { d.equipProfiles = {}; Object.entries(PRESETS).forEach(([k,v]) => d.equipProfiles[k] = JSON.parse(JSON.stringify(v))); d.equipProfiles.home.maxBarKg = d.settings.homeMaxKg || 90; d.activeEquip = 'home'; }
  if (!d.equipProfiles[d.activeEquip]) d.activeEquip = 'home';
}
const activeEquip = () => { ensureEquip(); return Store.d.equipProfiles[Store.d.activeEquip]; };
const hasAll = (eq, needs) => (needs || []).every(n => eq.equip.includes(n));
const hasAny = (eq, any) => !any || any.some(n => eq.equip.includes(n));
const canDo = (eq, meta) => !!meta && hasAll(eq, meta.needs) && hasAny(eq, meta.anyOf);
const roundDb = (kg, max) => Math.min(max, Math.max(2.5, Math.round(kg / 2.5) * 2.5));

// ── Slot time estimate (minutes) ────────────────────────────────────
function estSlot(sl) {
  const wk = sl.wk || {}, n = Math.max(1, sl.sets.filter(s => !s.ramp).length || (typeof wk.sets === 'number' ? wk.sets : parseInt(wk.sets) || 1));
  const side = wk.perSide ? 1.6 : 1;
  if (sl.intent === 'prep') return wk.durationMin || 8;
  if (sl.kind === 'main') return (sl.finding ? 6 : 2) + n * 3;
  if (sl.kind === 'lift') return n * (0.8 * side + 1.2);
  if (sl.kind === 'strict') return n * 2.2;
  if (sl.kind === 'hold') return n * ((wk.holdSec || 30) * (wk.perSide ? 2 : 1) / 60 + 0.6);
  if (sl.kind === 'erg') return wk.durationMin || n * ((wk.workSec || 60) + (wk.restSec || 60)) / 60;
  if (sl.kind === 'run') return wk.durationMin || (wk.workSec ? n * (wk.workSec + (wk.restSec || 0)) / 60 : 26);
  if (sl.kind === 'circuit') return (wk.rounds || 3) * (wk.items?.length || 1) * 1.2 + ((wk.rounds || 3) - 1) * (wk.restSec || 0) / 60;
  if (sl.kind === 'emom') return wk.totalMin || 10;
  if (sl.kind === 'amrap' || sl.kind === 'fortime') return wk.capMin || 10;
  if (wk.durationMin) return wk.durationMin;
  return n * (((wk.restSec || 60) / 60) + 0.4);
}
const estWorkout = w => Math.round(w.slots.filter(s => !s.skipped && !s.removed).reduce((a, s) => a + estSlot(s), 0));

// ── Core: adapt a built workout. Returns a proposal; nothing applied silently ──
function proposeAdaptation(w, opts) {
  const eq = opts.equip, changes = [], out = JSON.parse(JSON.stringify(w));
  const r = opts.readiness, painRegion = r?.pain >= 3 ? norm(r.painRegion) : null;
  const kept = s => (opts.keep || []).includes(s.slotId);
  out.slots.forEach(sl => {
    if (kept(sl)) return;
    const meta = EX[sl.exercise];
    const needSub = meta && !canDo(eq, meta);
    const painHit = painRegion && meta && (meta.regions || []).includes(painRegion);
    if (!needSub && !painHit) return;
    const cands = (SUBS[sl.exercise] || []).filter(c => hasAll(eq, c.needs) && hasAny(eq, c.anyOf) && !(painRegion && (c.regions || []).includes(painRegion)));
    const c = cands[0];
    const why = needSub ? `${eq.name}: no ${meta.needs.concat(meta.anyOf ? ['any of ' + meta.anyOf.join('/')] : []).filter(n => !eq.equip.includes(n)).map(n => (EQUIP.find(e => e[0] === n) || [n, n])[1]).join(', ')}` : `Pain ${r.pain}/10 (${r.painRegion}) — this loads that area`;
    if (!c || c.remove) {
      if (painHit && !needSub && r.pain < 5 && sl.priority === 'P1') { changes.push({ slotId: sl.slotId, type: 'caution', from: sl.name, to: sl.name + ' — no load increase, stop if pain rises', fid: 'equivalent', why }); sl.caution = true; if (sl.rx) { sl.rx.reason += ' · pain flag: held'; } return; }
      changes.push({ slotId: sl.slotId, type: 'remove', from: sl.name, to: 'Removed', fid: 'different', why: why + (c?.remove ? '' : ' — no suitable substitute'), priority: sl.priority });
      sl.removed = true; return;
    }
    const before = sl.name;
    applySub(sl, c, eq);
    changes.push({ slotId: sl.slotId, type: 'sub', from: before, to: sl.name, fid: sl.adapted.fid, why, note: sl.adapted.note, rx: sl.adapted.rxText, priority: sl.priority });
  });

  // Readiness adjustments (proposed, reviewable)
  if (r && r.band !== 'green' && opts.applyReadiness) {
    out.slots.forEach(sl => {
      if (sl.removed || kept(sl)) return;
      if (['P3','P4'].includes(sl.priority) && sl.sets.length > 1) { sl.sets = sl.sets.slice(0, -1); changes.push({ slotId: sl.slotId, type: 'trim', from: sl.name, to: `${sl.sets.length} sets (−1)`, fid: 'equivalent', why: `${r.band} readiness` }); }
      if (r.band === 'red') {
        if (sl.kind === 'main' && sl.sets.length > 2) { sl.sets = sl.sets.slice(0, -1); changes.push({ slotId: sl.slotId, type: 'trim', from: sl.name, to: `${sl.sets.length} sets at last week's load`, fid: 'equivalent', why: 'red readiness' }); }
        const pat = EX[sl.exercise]?.pattern;
        if (pat === 'sprint') { sl.wk = { ...sl.wk, sets: 4, text: '4 × 30m technique build-ups @ ≤80%. No max-speed work when flat.', intensityPct: [70, 80] }; sl.sets = Array.from({ length: 4 }, () => ({ done: false })); sl.adapted = { from: sl.name, fid: 'different', note: 'Converted to technique build-ups for red readiness.' }; sl.name = 'Technique build-ups (≤80%)'; changes.push({ slotId: sl.slotId, type: 'sub', from: sl.adapted.from, to: sl.name, fid: 'different', why: 'red readiness — no max-speed work when flat' }); }
        if (pat === 'jump') { sl.removed = true; changes.push({ slotId: sl.slotId, type: 'remove', from: sl.name, to: 'Cut', fid: 'different', why: 'red readiness — no max-effort jumps when flat' }); }
      }
    });
  }

  // Time compression
  if (opts.timeMin) {
    const full = estWorkout(out);
    if (full > opts.timeMin) {
      const live = () => out.slots.filter(s => !s.removed && !kept(s));
      const over = () => estWorkout(out) > opts.timeMin;
      const minSets = sl => (sl.priority === 'P1' ? 2 : 1);
      const steps = [
        () => live().filter(s => s.priority === 'P4').forEach(s => { if (over()) { s.removed = true; changes.push({ slotId: s.slotId, type: 'remove', from: s.name, to: 'Cut', fid: 'different', why: 'time — optional work goes first' }); } }),
        () => live().filter(s => s.intent === 'prep').forEach(s => { if (over() && (s.wk.durationMin || 8) > 5) { s.wk = { ...s.wk, durationMin: 5, text: 'Compressed warm-up (5 min) — shortened, never skipped' }; changes.push({ slotId: s.slotId, type: 'trim', from: s.name, to: '5 min', fid: 'close', why: 'time' }); } }),
        () => live().filter(s => s.priority === 'P3').forEach(s => { if (over() && s.sets.length > 1) { s.sets = s.sets.slice(0, -1); changes.push({ slotId: s.slotId, type: 'trim', from: s.name, to: `${s.sets.length} sets`, fid: 'close', why: 'time' }); } }),
        () => live().filter(s => s.priority === 'P3').forEach(s => { if (over()) { s.removed = true; changes.push({ slotId: s.slotId, type: 'remove', from: s.name, to: 'Cut', fid: 'different', why: 'time — complementary work' }); } }),
        () => live().filter(s => s.priority === 'P2' && s.intent !== 'prep').forEach(s => { while (over() && s.sets.length > minSets(s)) { s.sets = s.sets.slice(0, -1); } if (s.sets.length < (w.slots.find(x => x.slotId === s.slotId)?.sets.length || 0)) changes.push({ slotId: s.slotId, type: 'trim', from: s.name, to: `${s.sets.length} set(s) — minimum dose`, fid: 'close', why: 'time' }); }),
        () => live().filter(s => s.priority === 'P1' && s.kind !== 'main' && s.intent !== 'prep').forEach(s => { const n0 = s.sets.length; while (over() && s.sets.length > minSets(s)) s.sets = s.sets.slice(0, -1); if (s.sets.length < n0) changes.push({ slotId: s.slotId, type: 'trim', from: s.name, to: `${s.sets.length} of ${n0} sets — primary work, minimum kept`, fid: 'close', why: 'time' }); }),
        () => live().filter(s => s.kind === 'main').forEach(s => { if (over() && s.targetSets > 2) { s.targetSets = 2; if (!s.finding) s.sets = s.sets.slice(0, 2); s.wk = { ...s.wk, sets: 2 }; changes.push({ slotId: s.slotId, type: 'trim', from: s.name, to: '2 working sets', fid: 'close', why: 'time — primary lift kept, volume reduced' }); } }),
      ];
      for (const st of steps) { if (!over()) break; st(); }
      out._timeNote = { full, now: estWorkout(out), target: opts.timeMin, fits: !over() };
      // One line per exercise: a later cut supersedes an earlier trim
      const cut = new Set(changes.filter(c => c.type === 'remove').map(c => c.slotId));
      for (let i = changes.length - 1; i >= 0; i--) if (changes[i].type === 'trim' && cut.has(changes[i].slotId)) changes.splice(i, 1);
      const seen = {}; for (let i = changes.length - 1; i >= 0; i--) { const c = changes[i]; if (c.type !== 'trim') continue; if (seen[c.slotId]) changes.splice(i, 1); else seen[c.slotId] = 1; }
    }
  }
  out.slots = out.slots.filter(s => !s.removed);
  out.adaptation = { equip: eq.name, timeMin: opts.timeMin || null, readiness: r?.band || null, changes, at: Date.now(), engine: 'apex-local/1' };
  return out;
}
function norm(region) { return ({ 'Ankle':'ankle','Calf':'calf','Hamstring':'hamstring','Groin':'groin','Knee':'knee','Back':'back','Shoulder/pec':'shoulder/pec' })[region] || null; }

// Apply a substitute to a built slot, transforming the prescription to approximate the stimulus
function applySub(sl, c, eq) {
  const wk = sl.wk || {}, orig = { name: sl.name, exercise: sl.exercise };
  const nSets = Math.max(1, sl.targetSets || (typeof wk.sets === 'number' ? wk.sets : parseInt(wk.sets) || 3));
  let fid = c.fid, note = c.note || '', rxText = '';
  sl.exercise = c.ex; sl.name = c.name;
  if (c.bw) {
    sl.kind = 'lift'; sl.finding = false;
    sl.sets = Array.from({ length: nSets }, () => ({ load: null, reps: c.bw.reps, done: false }));
    sl.wk = { ...wk, sets: nSets, reps: c.bw.reps, perSide: !!c.bw.perSide, rpe: [7, 8], load: undefined, text: wk.text };
    rxText = `${nSets} × ${c.bw.reps}${c.bw.perSide ? ' / side' : ''} @ RPE 7–8`;
  } else if (c.ratio != null) {
    // Target bar load → per-hand DB load. If the rack tops out, raise reps + add tempo: approximation, not equivalence.
    const barLoad = sl.finding ? null : (sl.rx?.load || sl.sets.find(s => s.load)?.load || null);
    const reps = typeof wk.reps === 'number' ? wk.reps : 8;
    sl.kind = 'lift'; sl.finding = false;
    if (!barLoad) {
      sl.sets = Array.from({ length: nSets }, () => ({ load: null, reps, done: false }));
      rxText = `${nSets} × ${reps}${c.perSide ? ' / side' : ''} — pick a load for RPE 7`;
    } else {
      const wantPerHand = (barLoad * c.ratio) / (c.perSide ? 1 : 2);
      const max = eq.maxDbKg || 0;
      if (max && wantPerHand <= max) {
        const kg = roundDb(wantPerHand, max);
        sl.sets = Array.from({ length: nSets }, () => ({ load: kg, reps, done: false }));
        rxText = `${nSets} × ${reps}${c.perSide ? ' / side' : ''} @ ${fmtKg(kg)}kg DBs`;
      } else {
        const kg = max || null, newReps = Math.min(12, Math.round(reps * 1.6));
        sl.sets = Array.from({ length: nSets }, () => ({ load: kg, reps: newReps, done: false }));
        fid = FID_ORDER[Math.min(3, FID_ORDER.indexOf(fid) + 1)];
        note = (note ? note + ' ' : '') + `Heaviest DBs (${kg ?? '—'}kg) are below the ~${fmtKg(wantPerHand)}kg needed: reps raised to ${newReps} with a 3s lowering. Strength stimulus reduced; hypertrophy/capacity preserved.`;
        rxText = `${nSets} × ${newReps}${c.perSide ? ' / side' : ''} @ ${fmtKg(kg)}kg, 3s lowering`;
      }
    }
    sl.wk = { ...wk, sets: nSets, reps: sl.sets[0].reps, perSide: !!c.perSide, rpe: [7, 8], text: c.tempo ? `Tempo: ${c.tempo}` : wk.text };
  } else {
    const meta = EX[c.ex];
    if (meta?.load === 'erg' || /z2|intervals|walk|circuit|sprints/.test(c.ex)) {
      sl.kind = /intervals|circuit|sprints/.test(c.ex) || wk.workSec ? 'check' : 'check';
      sl.sets = Array.from({ length: Math.max(1, typeof wk.sets === 'number' ? wk.sets : 1) }, () => ({ done: false }));
      if (c.ex === 'bike_sprints') sl.wk = { ...wk, sets: 6, text: '6 × 8s all-out, 2 min easy between' };
      rxText = wk.workSec ? `${wk.sets} × ${mmss(wk.workSec)} / ${mmss(wk.restSec)} @ RPE ${(wk.rpe || [7]).join('–')}` : (wk.durationMin ? `${wk.durationMin} min easy` : (sl.wk.text || ''));
    }
  }
  sl.adapted = { from: orig.name, fromExercise: orig.exercise, fid, note, rxText };
  delete sl.rx;
}

// ── AI request (copy to clipboard → paste into an AI chat; no API key in the app) ──
function buildAIRequest(date, key, opts) {
  const recent = [...Store.d.sessions].sort((a, b) => b.endedAt - a.endedAt).slice(0, 8).map(s => ({ date: s.scheduledDate, session: s.sessionKey, rpe: s.sessionRpe, min: s.durationMin, adapted: s.adaptation?.changes?.length || 0,
    main: s.slots.filter(x => x.kind === 'main').map(x => ({ ex: x.exercise, sets: x.sets.filter(y => y.done && !y.ramp).map(y => `${y.load}x${y.reps}`), finalRpe: x.finalRpe })) }));
  return { schema: 'apex.adaptationRequest/1', createdAt: new Date().toISOString(),
    instructions: 'Propose a modified version of the planned session. Preserve training intent. Return JSON with schema "apex.adaptationProposal/1": { changes:[{slotId, from, to, prescription, fidelity:"equivalent|close|approximate|different", rationale}] }. Do not diagnose injuries.',
    athlete: { sex: Store.d.athlete.sex, age: Store.d.athlete.age, injuryHistory: Store.d.athlete.injuryHistory },
    block: { name: P().block.name, week: weekOf(date)?.week, weekLabel: weekOf(date)?.label },
    plannedSession: { key, name: P().sessions[key].name, intent: P().sessions[key].intent, slots: P().sessions[key].slots.map(s => ({ id: s.id, name: s.name, priority: s.priority, intent: s.intent, prescription: s.byWeek[String(weekOf(date)?.week || 1)] })) },
    constraints: { equipment: opts.equip.equip, maxDumbbellKg: opts.equip.maxDbKg, maxBarbellKg: opts.equip.maxBarKg, availableMin: opts.timeMin, location: opts.equip.name },
    readiness: opts.readiness || null, recentSessions: recent };

const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');

}

const TIERS = [

  { id: 'gold', name: 'Gold', min: 60 }, { id: 'platinum', name: 'Platinum', min: 75 },

const SPECIALS = {

  totb:         { name: 'Team of the Block', rank: 2, xp: 400, short: 'TEAM OF THE BLOCK', how: 'Finish a training block with ≥95% core adherence and ≥2 confirmed improvements — at least one on a rated core test.' },
  potm:         { name: 'Player of the Month', rank: 3, xp: 300, short: 'PLAYER OF THE MONTH', how: 'A calendar month with ≥90% core adherence (≥8 sessions due) and a confirmed improvement: a rated test, or a main training lift up ≥5% on the previous month.' },
  hattrick:     { name: 'Hat-trick', rank: 4, xp: 250, short: 'HAT-TRICK', how: 'Confirmed improvements on 3 different rated core tests within 14 days.' },
  breakthrough: { name: 'Breakthrough', rank: 5, xp: 200, short: 'BREAKTHROUGH', how: 'A confirmed jump to a new main level on a rated core test (e.g. Trained → Competitive).' },
  everpresent:  { name: 'Ever Present', rank: 6, xp: 250, short: 'EVER PRESENT', how: '8 consecutive program weeks with every core session completed. Adapted and travel sessions count.' },
  comeback:     { name: 'Comeback', rank: 7, xp: 300, short: 'COMEBACK', how: 'Return to all three pre-break training lifts: front squat 60×5, deadlift 90×5, bench 56×5 at RPE ≤ 8. One-off.' },

const SPECIAL_DAYS = 7;

// Confirmed improvements that respect test spacing (≥ half the retest interval since the previous result)
function spacedImprovements(id) {
  const m = METRICS[id], s = metricState(id); if (!s.trail) return [];
  const minGap = Math.round((m.retest?.[0] || 28) / 2);
  return s.trail.filter(t => t.kind === 'improved').filter(t => { const i = s.pool.indexOf(t.to), prev = s.pool[i - 1]; return prev && daysBetween(prev.date, t.to.date) >= minGap && !t.to.approx; })
    .map(t => ({ id, date: t.to.date, from: t.from.v, to: t.to.v, levelFrom: m.anchors ? levelFromRating(rate(id, t.from.v)) : null, levelTo: m.anchors ? levelFromRating(rate(id, t.to.v)) : null }));
}
const CORE_IDS = () => Object.keys(METRICS).filter(id => METRICS[id].tier === 'core');
function liftE1rmBest(from, to) {
  const out = {}; Store.d.observations.filter(o => ['front_squat_set', 'deadlift_set', 'bench_press_set'].includes(o.metric) && String(o.source).startsWith('v2:') && o.date >= from && o.date <= to && o.e1rm)
    .forEach(o => { out[o.metric] = Math.max(out[o.metric] || 0, o.e1rm); }); return out;
}
function monthRange(ym) { const [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate(); return [`${ym}-01`, `${ym}-${pad(last)}`]; }

function computeAwards() {
  if (!P()) return [];
  const aw = [], add = (type, date, evidence) => aw.push({ key: `${type}:${date}:${evidence.k || ''}`, type, date, expires: addDays(date, SPECIAL_DAYS), evidence });
  const t = today(), start = v2Start(), core = CORE_IDS(), imps = core.flatMap(spacedImprovements).sort((a, b) => a.date.localeCompare(b.date));
  // Breakthrough — new MAIN level
  imps.forEach(i => { if (i.levelFrom && i.levelTo && i.levelTo.li > i.levelFrom.li) add('breakthrough', i.date, { k: i.id, text: `${METRICS[i.id].name}: ${i.levelFrom.name} → ${i.levelTo.name} (${METRICS[i.id].fmt(i.from).replace(/ ·.*/, '')} → ${METRICS[i.id].fmt(i.to).replace(/ ·.*/, '')})` }); });
  // Hat-trick — 3 different core tests within 14 days
  for (let i = 0; i < imps.length; i++) {
    const win = imps.filter(x => x.date >= imps[i].date && daysBetween(imps[i].date, x.date) <= 14), ids = [...new Set(win.map(x => x.id))];
    if (ids.length >= 3) { const third = win.find((x, j) => new Set(win.slice(0, j + 1).map(y => y.id)).size === 3); add('hattrick', third.date, { k: imps[i].date, text: ids.slice(0, 3).map(id => METRICS[id].name).join(' · ') }); i = imps.indexOf(third); }
  }
  // Player of the Month — fully elapsed calendar months
  const months = []; for (let d = start.slice(0, 7); d < t.slice(0, 7); ) { months.push(d); const [y, m] = d.split('-').map(Number); d = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; }
  months.forEach(ym => {
    const [a, b] = monthRange(ym), ad = adherenceRange(a, b); if (ad.due < 8 || ad.pct < 90) return;
    const testImp = imps.find(i => i.date >= a && i.date <= b);
    const prevEnd = addDays(a, -1), prevStart = addDays(a, -31), cur = liftE1rmBest(a, b), prev = liftE1rmBest(prevStart, prevEnd);
    const lift = Object.keys(cur).find(k => prev[k] && cur[k] >= prev[k] * 1.05);
    if (!testImp && !lift) return;
    add('potm', addDays(b, 1), { k: ym, text: `${new Date(+ym.slice(0, 4), +ym.slice(5) - 1, 15).toLocaleString('en-AU', { month: 'long', year: 'numeric' })} · ${ad.pct}% adherence · ${testImp ? METRICS[testImp.id].name + ' improved' : LIFT_NAMES[lift.replace('_set', '')] + ' e1RM +' + Math.round((cur[lift] / prev[lift] - 1) * 100) + '%'}` });
  });
  // Team of the Block
  const blk = P().block;
  if (blk && t > blk.end) { const ad = adherenceRange(blk.start, blk.end), inBlk = imps.filter(i => i.date >= blk.start && i.date <= blk.end), ids = new Set(inBlk.map(i => i.id));
    const lifts = Object.entries(liftE1rmBest(blk.start, blk.end)).filter(([k, v]) => { const first = Store.d.observations.filter(o => o.metric === k && String(o.source).startsWith('v2:') && o.date >= blk.start).sort((x, y) => x.date.localeCompare(y.date))[0]; return first && v >= first.e1rm * 1.05; });
    if (ad.due && ad.pct >= 95 && ids.size >= 1 && ids.size + lifts.length >= 2) add('totb', addDays(blk.end, 1), { k: blk.id, text: `${blk.name} · ${ad.pct}% adherence · ${ids.size + lifts.length} confirmed improvements` }); }
  // Ever Present — 8 consecutive weeks fully complete
  let run = 0; (P().weeks || []).forEach(w => { const end = addDays(w.start, 6); if (end > t) return;
    const ds = Array.from({ length: 7 }, (_, i) => addDays(w.start, i)).filter(d => d >= start), m = scheduleMap(), core2 = ds.filter(d => m[d]?.session && !P().sessions[m[d].session].optional);
    if (!core2.length) return; if (core2.every(d => completedOn(d).length)) { run++; if (run === 8) { add('everpresent', addDays(end, 1), { k: w.week, text: `Weeks ${w.week - 7}–${w.week}: every core session done` }); run = 0; } } else run = 0; });
  // Comeback
  const q = quests().filter(x => ['back60', 'deadlift90', 'bench56'].includes(x.id));
  if (q.length === 3 && q.every(x => x.done)) add('comeback', q.map(x => x.doneDate).sort().pop(), { k: 'once', text: 'Front squat 60×5 · Deadlift 90×5 · Bench 56×5 — pre-break training capacity restored' });
  // Icon — evaluated at each rated-test date
  let was = false; [...new Set(core.flatMap(id => (metricState(id).pool || []).map(x => x.date)))].sort().forEach(d => {
    const c = computeCard(d), ok = c.ath.r != null && c.ath.r >= 80 && !c.ath.parts.some(p => p.state?.stale);
    if (ok && !was) add('icon', d, { k: d, text: `Athletic Index ${c.ath.r}` }); was = ok; });
  return aw.filter(a => a.date <= t).sort((a, b) => a.date.localeCompare(b.date));
}
function activeSpecial(awards) {

      addObs({ metric: sl.exercise+'_set', value:{ load: top.load, reps: top.reps, rpe: sl.finalRpe ?? top.rpe ?? null, sets: ws.length }, e1rm: e, unit:'kg×reps', date: s.scheduledDate, method:'barbell', source:'v2:'+s.id, quality:'verified', sessionId: s.id });

      <div class="grid2" style="margin-top:10px"><div><div class="dim" style="font-size:12px">Intervals completed</div><input class="num" inputmode="numeric" value="${m.rounds ?? ''}" placeholder="of ${n}" onchange="blkRes(${si},'rounds',this.value,${n})"></div><div><div class="dim" style="font-size:12px">Missed intervals</div><input class="num" inputmode="numeric" value="${m.missed ?? ''}" placeholder="0" onchange="blkRes(${si},'missed',this.value,${n})"></div></div>`;
  } else if (sl.kind === 'amrap') {

function emomTimer(si) { const sl = W.slots[si], n = Math.round(sl.wk.totalMin * 60 / sl.wk.intervalSec); runTimer(Array.from({ length: n }, (_, k) => ({ label: `Minute ${k + 1}/${n} — ${sl.wk.items[k % sl.wk.items.length]?.name || ''}`, sec: sl.wk.intervalSec, kind: 'work' })), { onDone: () => { if (sl.measures.rounds == null) blkRes(si, 'rounds', String(n), n); toast('EMOM done'); } }); }
let ftH = null;
function ftStart(si) { const m = W.slots[si].measures; audioUnlock(); m.since = Date.now(); m.timeSec = null; m.capped = false; persist(); redraw(); clearInterval(ftH); ftH = setInterval(() => { const sl = W?.slots[si]; if (!sl?.measures.since) return clearInterval(ftH); const el = (Date.now() - sl.measures.since) / 1000; if ($('#ftT')) $('#ftT').textContent = mmss(el); if (el >= sl.wk.capMin * 60) { beep(2); ftStop(si, true); } }, 300); }
function ftStop(si, capped) { const sl = W.slots[si], m = sl.measures; if (!m.since) return; m.timeSec = Math.min(Math.round((Date.now() - m.since) / 1000), sl.wk.capMin * 60); m.since = null; m.capped = capped; if (capped) { const r = prompt('Reps completed before the cap (optional)'); m.repsDone = r ? parseInt(r) || null : null; sl.partial = { reason: 'hit the time cap' }; } else delete sl.partial; sl.sets[0].done = true; sl.sets[0].at = Date.now(); clearInterval(ftH); persist(); redraw(); }

function importWorkoutSheet() {
  openSheet(`<h2>Import workout JSON</h2><textarea id="wjI" class="num" style="height:200px;margin-top:10px;font:12px/1.4 var(--mono);padding:10px" placeholder='{"schema":"apex.workout/1", …}'></textarea><button class="btn primary big" style="margin-top:10px" id="wjS">Review in builder</button>`);
  $('#wjS').onclick = () => {
    let j; try { j = JSON.parse($('#wjI').value.replace(/^```(json)?|```$/g, '').trim()); } catch (e) { return toast('Not valid JSON', true); }
    if (j.schema !== 'apex.workout/1' || !Array.isArray(j.blocks)) return toast('Expected schema apex.workout/1 with blocks', true);
    const t = newTpl(); Object.assign(t, { name: String(j.name || 'Imported workout').slice(0, 80), objective: String(j.objective || '').slice(0, 200), rpe: +j.rpe || null, tags: (j.tags || []).map(String).slice(0, 8), notes: 'Imported AI draft — review before use' });
    t.blocks = j.blocks.filter(b => BLOCK_TYPES[b.type] && Array.isArray(b.items)).map(b => ({ id: uid('bk'), type: b.type, label: b.label || 'Main', rounds: b.rounds, restSec: b.restSec, totalMin: b.totalMin, intervalSec: b.intervalSec, capMin: b.capMin,
      items: b.items.filter(i => i && (i.exId || i.name)).map(i => { const ex = libGet(i.exId); const pt = PT[i.ptype] ? i.ptype : (ex?.ptype || 'strength'); return { id: uid('it'), exId: ex ? ex.id : 'cx_' + String(i.exId || i.name).toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 40), name: String(i.name || ex?.name || i.exId).slice(0, 80), ptype: pt, presc: { ...defPresc(ex || { ptype: pt, uni: false }, pt), ...(i.presc || {}) }, notes: String(i.notes || '').slice(0, 200), optional: !!i.optional }; }) }));
    if (!t.blocks.some(b => b.items.length)) return toast('No usable exercises found', true);
    openBuilderWith(t, 'draft'); toast('Imported — review, then save');
  };
}

function renderPlan() {
  const p = P(); if (!p) { $('#view').innerHTML = '<h1>Plan</h1><div class="card">No program.</div>'; return; }
  const m = scheduleMap(), dates = Object.keys(m).sort(), warns = spacingWarnings(m);
  let h = `<div class="row between"><div class="eyebrow">${esc(p.season?.name || '')}</div><button class="btn sm" onclick="goTab('workouts')">+ Create a workout</button></div><h1 style="margin-top:4px">${esc(p.block.name)}</h1>
    <p class="muted" style="margin-top:4px;font-size:14px">${esc(p.phase?.name || '')} · ${fmtDay(p.block.start)} – ${fmtDay(p.block.end)}</p>
    ${warns.map(w => `<div class="warn">${esc(w)}</div>`).join('')}`;
  (p.weeks || []).forEach(w => {
    h += `<div class="card"><div class="row between"><b>Week ${w.week} · ${esc(w.label)}</b><span class="dim mono" style="font-size:12px">RPE ${w.mainLiftRpe.join('–')}</span></div>`;
    dates.filter(d => weekOf(d)?.week === w.week).forEach(d => {
      const x = m[d], st = dayStatus(d), s = x.session ? p.sessions[x.session] : null;
      h += `<div class="list-item" onclick="dayActions('${d}')" style="cursor:pointer"><div style="width:70px" class="mono ${d===today()?'':'dim'}" >${esc(fmtDay(d).slice(0,6))}</div>
        <div style="flex:1">${s ? `<b>${esc(x.session)}</b> ${esc(s.name)}${s.optional?' <span class="dim">(optional)</span>':''}` : `<span class="dim">Rest${x.note ? ' · ' + esc(x.note) : ''}</span>`}${x.window && s ? ' <span class="chip" style="font-size:9px">FLEX</span>' : ''}${CPLAN().filter(c => c.date === d).map(c => `<div class="dim" style="font-size:12px">＋ ${esc(c.name)}${c.status === 'done' ? ' ✓' : ''}${c.replacesPlan ? ' (replaces ' + esc(c.replacesPlan) + ')' : ''}</div>`).join('')}${Store.d.sessions.filter(s2 => s2.custom && s2.scheduledDate === d && !CPLAN().some(c => c.sessionId === s2.id)).map(s2 => `<div class="dim" style="font-size:12px">✓ ${esc(s2.name)}</div>`).join('')}</div>
        <span class="chip ${st==='done'||st==='sub'?'g':st==='missed'?'r':st==='flex'||st==='excused'?'b':''}">${({done:'DONE',sub:'SUB',missed:'MISSED',optional:'OPT',skipped:'—',flex:'MOVABLE',excused:'EXCUSED'})[st]||''}</span></div>`;
    });
    h += `</div>`;
  });
  (p.block.next || []).forEach(n => h += `<div class="card"><div class="eyebrow">${n.mode === 'travel' ? 'Travel' : 'Next block'}</div><b style="display:block;margin-top:6px">${esc(n.name)}</b><div class="reason">${fmtDay(n.start)}${n.end ? ' – ' + fmtDay(n.end) : ''}${n.note ? ' · ' + esc(n.note) : ''}</div></div>`);
  h += `<button class="btn" style="width:100%;margin-top:12px" onclick="calendarSheet()">Add sessions to my calendar (reminders)</button>`;
  h += `<div class="card"><div class="eyebrow">Rules this block runs on</div>${(p.rules||[]).map(r => `<div class="reason">• ${esc(r.text)}</div>`).join('')}</div>`;
  $('#view').innerHTML = h;
}

function stepperRaw(k, v) { const f = d => `Store.d.settings.homeMaxKg+=${d};ensureEquip();Store.d.equipProfiles.home.maxBarKg=Store.d.settings.homeMaxKg;Store.save();renderMe()`; return `<div class="stepper"><button onclick="${f(-5)}">−</button><div class="val">${v}</div><button onclick="${f(5)}">+</button></div>`; }

// ── Export / import ────────────────────────────────────────────────
function download(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportAll() {
  const payload = { format: 'apex-v3-export', schemaVersion: SCHEMA, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), data: Store.d };
  const name = `apex-v2-backup-${today()}.json`;
  try {
    const file = new File([JSON.stringify(payload)], name, { type: 'application/json' });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'Apex backup' }); }
    else download(payload, name);
    Store.d.lastExportAt = Date.now(); Store.save(); renderMe(); toast('Backup exported');
  } catch(e) { if (e.name !== 'AbortError') { download(payload, name); Store.d.lastExportAt = Date.now(); Store.save(); renderMe(); } }
}
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { let j; try { j = JSON.parse(rd.result); } catch(err) { return toast('Not a valid JSON file', true); } previewImport(j); };
  rd.readAsText(f);
};
function previewImport(j) {
  let kind = null, summary = '', apply = null, errs = [];
  if (j.format === 'apex-seed') { kind = 'Apex seed (legacy history + baseline)';
    const lp = j.legacy?.profiles?.[0]; summary = `${lp?.logs?.length || 0} legacy logs, ${j.baseline?.verified?.length || 0} verified baseline records, ${j.baseline?.bodyComposition?.length || 0} body entries`;
    apply = () => { if (j.legacy) migrateLegacy(j.legacy, 'seed-file'); if (j.baseline) applyBaseline(j.baseline); }; }
  else if (j.format === 'apex-export' || (Array.isArray(j.profiles))) { kind = 'Legacy Apex export'; const data = j.data || j; summary = `${data.profiles.length} profile(s), ${data.profiles[0]?.logs?.length || 0} logs`; apply = () => migrateLegacy(data, 'legacy-file'); }
  else if (j.schema === 'apex.program/1') { kind = 'Training program'; errs = validateProgram(j); summary = `${j.block?.name} · ${Object.keys(j.sessions||{}).length} sessions · ${j.schedule?.length || 0} days`; apply = () => { Store.d.program = j; Store.d.scheduleSwaps = {}; Store.d.migrations.push({ at: Date.now(), from: 'program-import', id: j.id }); }; }
  else if (j.schema === 'apex.athleteBaseline/1') { kind = 'Athlete baseline'; summary = `${j.verified?.length || 0} verified records`; apply = () => applyBaseline(j); }
  else if (j.schema === 'apex.benchmarks/1') { kind = 'Benchmark dataset';
    const req = ['metric','lens','source','population','sex','ageRange','protocol','year','values'];
    (j.benchmarks || []).forEach((b, i) => { const miss = req.filter(k => b[k] == null); if (miss.length) errs.push(`benchmark ${i + 1}: missing ${miss.join(', ')}`); if (b.metric && !METRICS[b.metric]) errs.push(`benchmark ${i + 1}: unknown metric ${b.metric}`); if (b.lens && !['males30','football'].includes(b.lens)) errs.push(`benchmark ${i + 1}: lens must be males30 or football`); });
    summary = `${(j.benchmarks || []).length} entries — every entry needs source, population, protocol, year`;
    apply = () => { Store.d.benchmarks = [...(Store.d.benchmarks || []), ...j.benchmarks]; Store.d.migrations.push({ at: Date.now(), from: 'benchmarks', n: j.benchmarks.length }); }; }
  else if (j.format === 'apex-v3-export') { kind = 'Apex V2 backup (full restore)'; summary = `${j.data.sessions.length} sessions, ${j.data.observations.length} records — replaces everything on this device`; apply = () => { Store.d = j.data; }; }
  else errs.push('Unrecognised file. Expected an Apex export, seed, program or baseline.');
  openSheet(`<h2>Import preview</h2>${kind ? `<div class="chip b" style="margin-top:8px">${esc(kind)}</div><div class="reason">${esc(summary)}</div>` : ''}
    ${errs.length ? `<div class="warn">${errs.map(esc).join('<br>')}</div><div class="reason">Nothing has been changed.</div>` : `<div class="reason">A snapshot of your current data is taken first, so this can be undone from Me → Data.</div><button class="btn primary big" style="margin-top:14px" id="impGo">Import</button>`}`);
  if (!errs.length && apply) $('#impGo').onclick = () => { snapshot('pre-import'); try { apply(); Store.save(); closeSheet(); render(); toast('Imported ✓'); } catch(e) { console.error(e); toast('Import failed: ' + e.message, true); } };
}
function restoreSnap(k) { if (!confirm('Restore this snapshot? Current data is snapshotted first.')) return; const s = JSON.parse(localStorage.getItem(k)); snapshot('pre-restore'); Store.d = s.data; Store.save(); render(); toast('Restored'); }
