    <div class="grid2" style="margin-top:14px"><div><div class="dim" style="font-size:12px">Weight (kg)</div><input class="num" id="bW" inputmode="decimal" placeholder="${last.weightKg ?? ''}"></div>
    <div><div class="dim" style="font-size:12px">Waist (cm)</div><input class="num" id="bWa" inputmode="decimal" placeholder="${last.waistCm ?? ''}"></div>
    <div><div class="dim" style="font-size:12px">Hip (cm) — optional</div><input class="num" id="bH" inputmode="decimal"></div>
    <div><div class="dim" style="font-size:12px">Neck (cm) — for Navy BF%</div><input class="num" id="bN" inputmode="decimal"></div></div>
    <button class="btn primary big" style="margin-top:16px" id="bSave">Save</button>`);
  $('#bSave').onclick = () => {
    const w = parseFloat($('#bW').value), wa = parseFloat($('#bWa').value), hp = parseFloat($('#bH').value) || null, n = parseFloat($('#bN').value) || null;
    if (!w) return toast('Weight is required', true);
    let bf = null; const ht = Store.d.athlete.heightCm;
    if (wa && n && ht && wa > n) bf = Math.round((86.010*Math.log10(wa-n) - 70.041*Math.log10(ht) + 36.76) * 10)/10;
    mergeBody({ date: today(), weightKg: w, waistCm: wa || null, hipCm: hp, bfPct: bf, bfMethod: bf ? 'US Navy (±3.5%)' : null, source: 'user' });
    Store.save(); closeSheet(); render(); toast(bf ? `Saved · BF ≈ ${bf}% (±3.5)` : 'Saved');
  };
}

// ── Export / import ────────────────────────────────────────────────
function download(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportAll() {
  const payload = { format: 'apex-v3-export', schemaVersion: SCHEMA, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), data: Store.d };
  const name = `apex-v2-backup-${today()}.json`;
  try {
    const file = new File([JSON.stringify(payload)], name, { type: 'application/json' });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'Apex backup' }); }
    else download(payload, name);
    Store.d.lastExportAt = Date.now(); Store.save(); renderMe(); toast('Backup exported');
  } catch(e) { if (e.name !== 'AbortError') { download(payload, name); Store.d.lastExportAt = Date.now(); Store.save(); renderMe(); } }
}
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { let j; try { j = JSON.parse(rd.result); } catch(err) { return toast('Not a valid JSON file', true); } previewImport(j); };
  rd.readAsText(f);
};
function previewImport(j) {
  let kind = null, summary = '', apply = null, errs = [];
  if (j.format === 'apex-seed') { kind = 'Apex seed (legacy history + baseline)';
    const lp = j.legacy?.profiles?.[0]; summary = `${lp?.logs?.length || 0} legacy logs, ${j.baseline?.verified?.length || 0} verified baseline records, ${j.baseline?.bodyComposition?.length || 0} body entries`;
    apply = () => { if (j.legacy) migrateLegacy(j.legacy, 'seed-file'); if (j.baseline) applyBaseline(j.baseline); }; }
  else if (j.format === 'apex-export' || (Array.isArray(j.profiles))) { kind = 'Legacy Apex export'; const data = j.data || j; summary = `${data.profiles.length} profile(s), ${data.profiles[0]?.logs?.length || 0} logs`; apply = () => migrateLegacy(data, 'legacy-file'); }
  else if (j.schema === 'apex.program/1') { kind = 'Training program'; errs = validateProgram(j); summary = `${j.block?.name} · ${Object.keys(j.sessions||{}).length} sessions · ${j.schedule?.length || 0} days`; apply = () => { Store.d.program = j; Store.d.scheduleSwaps = {}; Store.d.migrations.push({ at: Date.now(), from: 'program-import', id: j.id }); }; }
  else if (j.schema === 'apex.athleteBaseline/1') { kind = 'Athlete baseline'; summary = `${j.verified?.length || 0} verified records`; apply = () => applyBaseline(j); }
  else if (j.schema === 'apex.benchmarks/1') { kind = 'Benchmark dataset';
    const req = ['metric','lens','source','population','sex','ageRange','protocol','year','values'];
    (j.benchmarks || []).forEach((b, i) => { const miss = req.filter(k => b[k] == null); if (miss.length) errs.push(`benchmark ${i + 1}: missing ${miss.join(', ')}`); if (b.metric && !METRICS[b.metric]) errs.push(`benchmark ${i + 1}: unknown metric ${b.metric}`); if (b.lens && !['males30','football'].includes(b.lens)) errs.push(`benchmark ${i + 1}: lens must be males30 or football`); });
    summary = `${(j.benchmarks || []).length} entries — every entry needs source, population, protocol, year`;
    apply = () => { Store.d.benchmarks = [...(Store.d.benchmarks || []), ...j.benchmarks]; Store.d.migrations.push({ at: Date.now(), from: 'benchmarks', n: j.benchmarks.length }); }; }
  else if (j.format === 'apex-v3-export') { kind = 'Apex V2 backup (full restore)'; summary = `${j.data.sessions.length} sessions, ${j.data.observations.length} records — replaces everything on this device`; apply = () => { Store.d = j.data; }; }
  else errs.push('Unrecognised file. Expected an Apex export, seed, program or baseline.');
  openSheet(`<h2>Import preview</h2>${kind ? `<div class="chip b" style="margin-top:8px">${esc(kind)}</div><div class="reason">${esc(summary)}</div>` : ''}
    ${errs.length ? `<div class="warn">${errs.map(esc).join('<br>')}</div><div class="reason">Nothing has been changed.</div>` : `<div class="reason">A snapshot of your current data is taken first, so this can be undone from Me → Data.</div><button class="btn primary big" style="margin-top:14px" id="impGo">Import</button>`}`);
  if (!errs.length && apply) $('#impGo').onclick = () => { snapshot('pre-import'); try { apply(); Store.save(); closeSheet(); render(); toast('Imported ✓'); } catch(e) { console.error(e); toast('Import failed: ' + e.message, true); } };
}
function restoreSnap(k) { if (!confirm('Restore this snapshot? Current data is snapshotted first.')) return; const s = JSON.parse(localStorage.getItem(k)); snapshot('pre-restore'); Store.d = s.data; Store.save(); render(); toast('Restored'); }

// ════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════
Store.load(); applyUI(); ensureEquip(); dailySnapshot();
try { window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyUI); } catch(e) {}
try { navigator.storage?.persist?.(); } catch(e) {}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#rest').classList.contains('on')) tickRest(); });
render();
if (Store.d.activeWorkout) toast('Workout in progress — tap Resume');
</script>
